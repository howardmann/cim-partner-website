<svg viewBox="0 0 720 400" xmlns="http://www.w3.org/2000/svg" fill="none">
  <style>
    .eyebrow {
      font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      fill: #5a5a58;
    }
    .eyebrow-accent {
      font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      fill: #0f6b4d;
    }
    .label {
      font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif;
      font-size: 13px;
      font-weight: 600;
      fill: #0a0a0a;
    }
    .label-sub {
      font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif;
      font-size: 11.5px;
      fill: #5a5a58;
    }
    .mono {
      font-family: 'JetBrains Mono', 'Menlo', 'Consolas', monospace;
      font-size: 11px;
      font-weight: 500;
      fill: #0a0a0a;
    }
    .mono-muted {
      font-family: 'JetBrains Mono', 'Menlo', 'Consolas', monospace;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.06em;
      fill: #5a5a58;
    }
    .engine-title {
      font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      fill: #0a0a0a;
    }
  </style>

  <!-- ───────── Top caption strip ───────── -->
  <text x="24" y="28" class="eyebrow-accent">AI RULES ENGINE · TRANSPARENT, TUNABLE, EXPLAINABLE</text>

  <!-- ───────── Input nodes (left column) ─────────
       Real-time sensor feed → Trusted clean data flows horizontally
       into the engine. Engineer experts feed in from below. -->

  <!-- 1. Real-time sensor feed -->
  <rect x="24" y="64" width="132" height="58" rx="2" fill="#ffffff" stroke="#0a0a0a" stroke-width="1" />
  <text x="36" y="84" class="mono-muted">01 · INPUT</text>
  <text x="36" y="104" class="label">Real-time</text>
  <text x="36" y="118" class="label">sensor feed</text>

  <!-- arrow 1 → 2 -->
  <line x1="156" y1="93" x2="196" y2="93" stroke="#0f6b4d" stroke-width="1.6" />
  <polygon points="196,93 188,89 188,97" fill="#0f6b4d" />

  <!-- 2. Trusted clean data -->
  <rect x="200" y="64" width="132" height="58" rx="2" fill="#ffffff" stroke="#0a0a0a" stroke-width="1" />
  <text x="212" y="84" class="mono-muted">02 · ONTOLOGY</text>
  <text x="212" y="104" class="label">Trusted</text>
  <text x="212" y="118" class="label">clean data</text>

  <!-- arrow 2 → engine (horizontal into top of engine) -->
  <line x1="332" y1="93" x2="378" y2="93" stroke="#0f6b4d" stroke-width="1.6" />
  <polygon points="378,93 370,89 370,97" fill="#0f6b4d" />

  <!-- 3. Engineer experts (bottom input) -->
  <rect x="24" y="282" width="132" height="58" rx="2" fill="#ffffff" stroke="#0a0a0a" stroke-width="1" />
  <text x="36" y="302" class="mono-muted">03 · EXPERTISE</text>
  <text x="36" y="322" class="label">Engineer</text>
  <text x="36" y="336" class="label">experts</text>

  <!-- arrow from experts up/right into engine bottom -->
  <path d="M 156 311 C 240 311, 320 282, 378 282" stroke="#0f6b4d" stroke-width="1.6" fill="none" />
  <polygon points="378,282 370,278 370,286" fill="#0f6b4d" />

  <!-- ───────── AI Rules Engine (center hero) ───────── -->
  <rect x="380" y="50" width="220" height="270" rx="3" fill="#f6f6f4" stroke="#0a0a0a" stroke-width="1.5" />

  <!-- Engine title row -->
  <text x="490" y="80" text-anchor="middle" class="engine-title">AI Rules Engine</text>
  <line x1="402" y1="92" x2="578" y2="92" stroke="#cfccc3" stroke-width="1" />

  <!-- Three engine components -->
  <!-- Component 1: Automated checks -->
  <rect x="402" y="106" width="176" height="56" rx="2" fill="#ffffff" stroke="#0a0a0a" stroke-width="1" />
  <text x="414" y="124" class="mono-muted">CHECKS</text>
  <text x="414" y="144" class="label">Automated checks</text>
  <text x="414" y="158" class="label-sub">billions, real-time</text>

  <!-- Component 2: Knowledge base -->
  <rect x="402" y="172" width="176" height="56" rx="2" fill="#ffffff" stroke="#0a0a0a" stroke-width="1" />
  <text x="414" y="190" class="mono-muted">KNOWLEDGE</text>
  <text x="414" y="210" class="label">Rules &amp; knowledge base</text>
  <text x="414" y="224" class="label-sub">tunable, explainable</text>

  <!-- Component 3: Triage / action -->
  <rect x="402" y="238" width="176" height="56" rx="2" fill="#ffffff" stroke="#0a0a0a" stroke-width="1" />
  <text x="414" y="256" class="mono-muted">AUTOMATION</text>
  <text x="414" y="276" class="label">Triage · action · QA</text>
  <text x="414" y="290" class="label-sub">prioritised, assigned</text>

  <!-- ───────── Output (right) ───────── -->
  <!-- arrow engine → operators -->
  <line x1="600" y1="185" x2="640" y2="185" stroke="#0f6b4d" stroke-width="1.6" />
  <polygon points="640,185 632,181 632,189" fill="#0f6b4d" />

  <rect x="644" y="156" width="60" height="58" rx="2" fill="#ffffff" stroke="#0a0a0a" stroke-width="1" />
  <text x="652" y="176" class="mono-muted">OUTPUT</text>
  <text x="674" y="196" text-anchor="middle" class="label">Building</text>
  <text x="674" y="210" text-anchor="middle" class="label">operators</text>

  <!-- ───────── Bottom caption strip ───────── -->
  <line x1="24" y1="368" x2="704" y2="368" stroke="#e6e4de" stroke-width="1" />
  <text x="24" y="386" class="eyebrow">DECADES OF MECHANICAL &amp; CONTROLS EXPERTISE · ENCODED, RUN AT GLOBAL SCALE</text>
</svg>
