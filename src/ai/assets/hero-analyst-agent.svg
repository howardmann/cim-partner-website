<svg viewBox="0 0 600 700" xmlns="http://www.w3.org/2000/svg" fill="none">
  <defs>
    <filter id="cardshadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <style>
    .eyebrow {
      font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.1em;
      fill: #6b7280;
    }
    .body {
      font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif;
      font-size: 14px;
      fill: #111827;
    }
    .body-secondary {
      font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif;
      font-size: 13px;
      fill: #6b7280;
    }
    .heading {
      font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif;
      font-size: 16px;
      font-weight: 600;
      fill: #111827;
    }
    .table-header {
      font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.08em;
      fill: #9ca3af;
    }
    .table-row {
      font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif;
      font-size: 14px;
      font-weight: 500;
      fill: #111827;
    }
    .table-data {
      font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif;
      font-size: 14px;
      fill: #111827;
      font-variant-numeric: tabular-nums;
    }
    .alert {
      fill: #d97706;
      font-weight: 600;
    }
    .good {
      fill: #6b7280;
    }
    .cta {
      font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif;
      font-size: 13px;
      font-weight: 500;
      fill: #0f6b4d;
    }
  </style>

  <!-- ============================================ -->
  <!-- Card 1: User query                            -->
  <!-- ============================================ -->
  <g filter="url(#cardshadow)">
    <rect x="245" y="12" width="345" height="78" rx="12" fill="white" stroke="#e5e7eb"/>
    <text x="269" y="40" class="eyebrow">YOU · 09:41</text>
    <text x="269" y="66" class="body">What needs attention at Skyline Tower?</text>
  </g>

  <!-- ============================================ -->
  <!-- Card 2: Analyst Agent response (main card)    -->
  <!-- ============================================ -->
  <g filter="url(#cardshadow)">
    <rect x="10" y="105" width="580" height="470" rx="12" fill="white" stroke="#e5e7eb"/>

    <!-- Eyebrow with green dot -->
    <circle cx="36" cy="138" r="4" fill="#0f6b4d"/>
    <text x="50" y="142" class="eyebrow">ANALYST AGENT</text>

    <!-- Heading -->
    <text x="32" y="180" class="heading">Skyline Tower · 47 alerts across 6 equipment types.</text>
    <text x="32" y="204" class="body-secondary">Priority concentration in Packaged Units. Lowest assignment coverage too.</text>

    <!-- Table header -->
    <text x="32" y="254" class="table-header">EQUIPMENT</text>
    <text x="340" y="254" class="table-header" text-anchor="end">P1–2 IN FAULT</text>
    <text x="430" y="254" class="table-header" text-anchor="end">P3–5</text>
    <text x="558" y="254" class="table-header" text-anchor="end">ASSIGNED</text>

    <line x1="32" y1="266" x2="558" y2="266" stroke="#e5e7eb" stroke-width="1"/>

    <!-- Row 1: Packaged Units (highlighted - this is the problem) -->
    <text x="32" y="296" class="table-row">Packaged Units</text>
    <text x="340" y="296" class="table-data alert" text-anchor="end">8</text>
    <text x="430" y="296" class="table-data" text-anchor="end">14</text>
    <text x="558" y="296" class="table-data alert" text-anchor="end">62%</text>

    <line x1="32" y1="312" x2="558" y2="312" stroke="#f3f4f6" stroke-width="1"/>

    <!-- Row 2: AHUs -->
    <text x="32" y="340" class="table-row">AHUs</text>
    <text x="340" y="340" class="table-data" text-anchor="end">3</text>
    <text x="430" y="340" class="table-data" text-anchor="end">11</text>
    <text x="558" y="340" class="table-data" text-anchor="end">91%</text>

    <line x1="32" y1="356" x2="558" y2="356" stroke="#f3f4f6" stroke-width="1"/>

    <!-- Row 3: Chillers -->
    <text x="32" y="384" class="table-row">Chillers</text>
    <text x="340" y="384" class="table-data" text-anchor="end">2</text>
    <text x="430" y="384" class="table-data" text-anchor="end">4</text>
    <text x="558" y="384" class="table-data" text-anchor="end">100%</text>

    <line x1="32" y1="400" x2="558" y2="400" stroke="#f3f4f6" stroke-width="1"/>

    <!-- Row 4: VAVs -->
    <text x="32" y="428" class="table-row">VAVs</text>
    <text x="340" y="428" class="table-data" text-anchor="end">1</text>
    <text x="430" y="428" class="table-data" text-anchor="end">3</text>
    <text x="558" y="428" class="table-data" text-anchor="end">67%</text>

    <line x1="32" y1="444" x2="558" y2="444" stroke="#f3f4f6" stroke-width="1"/>

    <!-- Row 5: Boilers -->
    <text x="32" y="472" class="table-row">Boilers</text>
    <text x="340" y="472" class="table-data" text-anchor="end">0</text>
    <text x="430" y="472" class="table-data" text-anchor="end">1</text>
    <text x="558" y="472" class="table-data" text-anchor="end">100%</text>

    <line x1="32" y1="488" x2="558" y2="488" stroke="#f3f4f6" stroke-width="1"/>

    <!-- Row 6: VRF -->
    <text x="32" y="516" class="table-row">VRF</text>
    <text x="340" y="516" class="table-data" text-anchor="end">0</text>
    <text x="430" y="516" class="table-data" text-anchor="end">2</text>
    <text x="558" y="516" class="table-data" text-anchor="end">100%</text>

    <line x1="32" y1="538" x2="558" y2="538" stroke="#e5e7eb" stroke-width="1"/>

    <!-- CTA -->
    <text x="32" y="562" class="cta">Drill into Packaged Units →</text>
  </g>

  <!-- ============================================ -->
  <!-- Card 3: Draft action                          -->
  <!-- ============================================ -->
  <g filter="url(#cardshadow)">
    <rect x="250" y="595" width="340" height="90" rx="12" fill="white" stroke="#e5e7eb"/>
    <circle cx="276" cy="628" r="4" fill="#0f6b4d"/>
    <text x="290" y="632" class="eyebrow">ANALYST AGENT · DRAFT</text>
    <text x="276" y="658" class="body">Email to @miguel ready for review</text>
    <text x="276" y="674" class="cta">Open draft →</text>
  </g>
</svg>
